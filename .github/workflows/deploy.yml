name: Django CI/CD Pipeline

# DB design: MySQL runs ONLY on the GitHub runner (service container).
# Persistence = encrypted snapshots on Google Drive (rclone, folder "hassan_shops").
#   start of run : restore latest snapshot -> local MySQL (first ever run: fresh DB)
#   end of run   : stop server, final snapshot -> Drive, keep latest 10
# No Aiven / cloud MySQL anywhere.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      restore_action:
        description: 'Empty = latest. Or snapshot file name to restore, or "list" to print available snapshots.'
        required: false
        default: ''
  repository_dispatch:
    types: [ backup_now, restore_now, migrate_now ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      local-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: local_django_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      EMAIL_HOST_USER: ${{ secrets.ORDER_ALERT_EMAILS }}
      SUMMERY_REC: ${{ secrets.SUMMERY_REC }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
      BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      MEDIA_STORAGE: "cloudinary"
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASS: "root"
      DB_NAME: "local_django_db"
      BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_SALT_KEY: ${{ secrets.DJANGO_SALT_KEY }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      SUPERUSER_NAME: ${{ secrets.SUPERUSER_NAME }}
      SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
      SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
      RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
      FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
      LICENSE_MACHINE_SEED: ${{ secrets.LICENSE_MACHINE_SEED }}
      LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
      PYTHONUNBUFFERED: "1"
      RUNNING_IN_TERMUX: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Wait for Previous Workflow Runs to Complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          while true; do
            OLDER_RUNS=$(gh api "repos/$REPO/actions/runs?branch=$BRANCH&per_page=20" --jq "[.workflow_runs[] | select(.id < $CURRENT_RUN_ID and (.status == \"in_progress\" or .status == \"queued\")) | .id]")
            TOTAL_PENDING=$(echo "$OLDER_RUNS" | jq 'length')
            if [ "${TOTAL_PENDING:-0}" -gt 0 ]; then
              echo "Older run(s) $OLDER_RUNS still active. Holding (ID: $CURRENT_RUN_ID)..."
              sleep 10
            else
              echo "No older active runs. Proceeding."
              break
            fi
          done

      - name: Install Pips & System Tools
        run: |
          if ! getent hosts archive.ubuntu.com >/dev/null 2>&1; then
            echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf >/dev/null
          fi

          if [ ! -f /etc/apt/sources.list.d/ubuntu.sources ] && [ ! -s /etc/apt/sources.list ]; then
            sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          fi

          for i in 1 2 3; do
            sudo apt-get update -y && break
            echo "apt-get update failed, retry $i..."
            sleep 5
          done

          for i in 1 2 3; do
            sudo apt-get install -y --fix-missing \
              mysql-client \
              rclone \
              libmysqlclient-dev \
              pkg-config \
              build-essential && break
            echo "apt-get install failed, retry $i..."
            sleep 10
          done

          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi

          python -m pip install --upgrade pip
          pip install mysqlclient gunicorn "django-import-export>=3.3.0" "django>=5.2,<5.3" \
            django-dbbackup django-axes reportlab openpyxl pillow python-barcode qrcode \
            cryptography python-dotenv requests django-pwa whitenoise \
            django-cloudinary-storage rembg numpy google-auth

      - name: Parse Trigger Source & Inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VAL: ${{ github.event.inputs.restore_action }}
          CLIENT_PAYLOAD_FILE: ${{ github.event.client_payload.file }}
        run: |
          RESTORE_TARGET="latest"
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            ACTION_TYPE="${{ github.event.action }}"
            if [ "$ACTION_TYPE" = "restore_now" ]; then
              RESTORE_TARGET="${CLIENT_PAYLOAD_FILE:-latest}"
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Web trigger: waiting 10 seconds buffer..."
            sleep 10
            if [ -n "$INPUT_VAL" ]; then RESTORE_TARGET="$INPUT_VAL"; fi
          fi
          echo "RESTORE_TARGET=$RESTORE_TARGET" >> "$GITHUB_ENV"
          echo "Restore target: $RESTORE_TARGET"

      - name: Setup Rclone & Snapshot Helpers
        run: |
          mkdir -p "$HOME/.config/rclone"
          echo "$RCLONE_CONFIG_DATA" > "$HOME/.config/rclone/rclone.conf"
          REMOTE_NAME=$(rclone listremotes | head -n 1 | tr -d ':')
          if [ -z "$REMOTE_NAME" ]; then echo "No rclone remote found in RCLONE_CONFIG_DATA"; exit 1; fi
          echo "DRIVE_DIR=${REMOTE_NAME}:hassan_shops" >> "$GITHUB_ENV"
          echo "HELPER_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

          cat > "$RUNNER_TEMP/crypt.py" <<'PYEOF'
          import base64, os, sys
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

          mode, src, dst = sys.argv[1], sys.argv[2], sys.argv[3]
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32,
                           salt=b'django_backup_salt_2026', iterations=100000)
          f = Fernet(base64.urlsafe_b64encode(kdf.derive(os.environ['BACKUP_SECRET_KEY'].encode())))
          data = open(src, 'rb').read()
          open(dst, 'wb').write(f.encrypt(data) if mode == 'enc' else f.decrypt(data))
          PYEOF

          cat > "$RUNNER_TEMP/notify.sh" <<'NEOF'
          #!/usr/bin/env bash
          TITLE="${1:-DB alert}"; TAGS="${2:-database}"; PRIO="${3:-default}"; MSG="${4:-}"
          RUN_URL="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}"
          curl -s --max-time 20 -H "Title: $TITLE" -H "Tags: $TAGS" -H "Priority: $PRIO" \
            -d "$(printf '%s\n' "$MSG" "" "Run: $RUN_URL" "Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')")" \
            ntfy.sh/kwlcnctstore > /dev/null || true
          NEOF
          chmod +x "$RUNNER_TEMP/notify.sh"

          cat > "$RUNNER_TEMP/snapshot.sh" <<'SHEOF'
          #!/usr/bin/env bash
          MODE="${1:-final}"
          cd "$GITHUB_WORKSPACE"
          exec 9>"$HELPER_DIR/snapshot.lock"
          flock 9
          set -uo pipefail

          MIN_PCT=60
          STAGE="start"

          db_rows() {
            MYSQL_PWD=root mysql -h 127.0.0.1 -P 3306 -u root -N -e \
              "SET SESSION information_schema_stats_expiry=0; SELECT table_name, table_rows FROM information_schema.tables WHERE table_schema='local_django_db' AND table_type='BASE TABLE' ORDER BY table_name;" 2>/dev/null
          }

          fail() {
            echo "[snapshot:$MODE] FAILED at stage '$STAGE': $1"
            bash "$HELPER_DIR/notify.sh" "DB snapshot FAILED at: $STAGE ($MODE)" "x,database" "high" \
              "$(printf '%s\n' "Failed at: $STAGE" "Mode: $MODE" "Reason: $1" "${2:-}" "" "Upload: SKIPPED - existing Drive snapshots untouched")"
            exit 1
          }

          if [ -f license.key ]; then
            LH=$(sha256sum license.key | cut -d' ' -f1)
            if [ "$LH" != "$(cat "$HELPER_DIR/license_hash" 2>/dev/null)" ]; then
              python "$HELPER_DIR/crypt.py" enc license.key "$HELPER_DIR/license.key.enc" \
                && rclone copyto "$HELPER_DIR/license.key.enc" "$DRIVE_DIR/license.key.enc" \
                && echo "$LH" > "$HELPER_DIR/license_hash" \
                && echo "[snapshot:$MODE] license.key saved to Drive" \
                || echo "[snapshot:$MODE] license.key upload FAILED"
            fi
          fi

          TS=$(date +"%Y%m%d_%H%M%S")
          NAME="db_snapshot_${TS}.sql.gz.enc"
          RAW="$HELPER_DIR/raw_${TS}.sql.gz"

          STAGE="mysqldump"
          if ! MYSQL_PWD=root mysqldump -h 127.0.0.1 -P 3306 -u root \
                --set-gtid-purged=OFF --column-statistics=0 --single-transaction \
                --skip-add-drop-table --no-tablespaces local_django_db \
                2> "$HELPER_DIR/dump_err.log" | gzip > "$RAW"; then
            rm -f "$RAW"
            fail "mysqldump exited with an error" "Error: $(tail -n 3 "$HELPER_DIR/dump_err.log" | tr '\n' ' ')"
          fi

          STAGE="size check (new vs restored snapshot)"
          NEW_SIZE=$(stat -c %s "$RAW")
          OLD_SIZE=$(cat "$HELPER_DIR/restored_size" 2>/dev/null || echo 0)
          OLD_NAME=$(cat "$HELPER_DIR/restored_name" 2>/dev/null || echo "none (first run)")

          if [ "$NEW_SIZE" -lt 5000 ]; then
            rm -f "$RAW"
            fail "dump is near-empty ($NEW_SIZE bytes, minimum 5000)" "Restored from: $OLD_NAME ($OLD_SIZE bytes)"
          fi

          if [ "$OLD_SIZE" -gt 0 ] && [ $((NEW_SIZE * 100)) -lt $((OLD_SIZE * MIN_PCT)) ]; then
            PCT=$((NEW_SIZE * 100 / OLD_SIZE))
            MIN_BYTES=$((OLD_SIZE * MIN_PCT / 100))
            db_rows > "$HELPER_DIR/rows_now.tsv"
            TABLES_NOW=$(wc -l < "$HELPER_DIR/rows_now.tsv")
            TABLES_THEN=$(wc -l < "$HELPER_DIR/rows_restored.tsv" 2>/dev/null || echo "?")
            SHRUNK=""
            if [ -s "$HELPER_DIR/rows_restored.tsv" ]; then
              SHRUNK=$(awk -F'\t' '
                NR==FNR { before[$1]=$2; next }
                { seen[$1]=1; if (($1 in before) && ($2+0) < (before[$1]+0)) printf "%.0f\t%s: ~%s -> ~%s rows\n", before[$1]-$2, $1, before[$1], $2 }
                END { for (t in before) if (!(t in seen)) printf "%.0f\t%s: MISSING (had ~%s rows)\n", 2000000000, t, before[t] }
              ' "$HELPER_DIR/rows_restored.tsv" "$HELPER_DIR/rows_now.tsv" | sort -t"$(printf '\t')" -k1,1nr | head -n 8 | cut -f2-)
            fi
            rm -f "$RAW"
            fail "new snapshot is only ${PCT}% of the restored one (minimum ${MIN_PCT}%)" \
              "$(printf '%s\n' \
                "Restored from: $OLD_NAME" \
                "Restored size: $OLD_SIZE bytes" \
                "New size: $NEW_SIZE bytes" \
                "Minimum allowed: $MIN_BYTES bytes" \
                "Tables: $TABLES_THEN at restore -> $TABLES_NOW now" \
                "Biggest drops (approx rows):" \
                "${SHRUNK:-  none detected - table row counts look unchanged}")"
          fi

          STAGE="encrypt"
          if ! python "$HELPER_DIR/crypt.py" enc "$RAW" "$HELPER_DIR/$NAME" 2> "$HELPER_DIR/enc_err.log"; then
            fail "encryption failed (check BACKUP_SECRET_KEY secret)" "Error: $(tail -n 2 "$HELPER_DIR/enc_err.log" | tr '\n' ' ')"
          fi

          STAGE="upload to Google Drive"
          if ! rclone copyto "$HELPER_DIR/$NAME" "$DRIVE_DIR/$NAME" 2> "$HELPER_DIR/up_err.log"; then
            fail "rclone upload failed" "File: $NAME ($NEW_SIZE bytes raw)
          Error: $(tail -n 3 "$HELPER_DIR/up_err.log" | tr '\n' ' ')"
          fi
          rm -f "$RAW" "$HELPER_DIR/$NAME"
          echo "[snapshot:$MODE] uploaded $NAME ($NEW_SIZE bytes raw)"

          STAGE="rotation"
          if rclone lsjson "$DRIVE_DIR" --files-only --include "db_snapshot_*" \
               | jq -r 'sort_by(.ModTime) | .[].Name' > "$HELPER_DIR/all_snaps.txt"; then
            TOTAL=$(wc -l < "$HELPER_DIR/all_snaps.txt")
            if [ "$TOTAL" -gt 10 ]; then
              head -n $((TOTAL - 10)) "$HELPER_DIR/all_snaps.txt" | while read -r F; do
                [ -n "$F" ] && rclone deletefile "$DRIVE_DIR/$F" && echo "rotated out: $F"
              done
            fi
          else
            bash "$HELPER_DIR/notify.sh" "DB snapshot uploaded, rotation FAILED" "warning" "default" \
              "$(printf '%s\n' "Uploaded: $NAME" "Stage: rotation (listing Drive snapshots failed)" "Old snapshots were NOT deleted.")"
          fi

          if [ "$MODE" = "final" ]; then
            PCT_TXT=""
            [ "$OLD_SIZE" -gt 0 ] && PCT_TXT=" = $((NEW_SIZE * 100 / OLD_SIZE))% of restored"
            bash "$HELPER_DIR/notify.sh" "DB Backup Successful" "white_check_mark,database" "default" \
              "$(printf '%s\n' "Snapshot: $NAME" "Raw size: $NEW_SIZE bytes${PCT_TXT}" "Restored from: $OLD_NAME ($OLD_SIZE bytes)")"
          fi
          SHEOF
          chmod +x "$RUNNER_TEMP/snapshot.sh"

      - name: Restore Database from Google Drive (additive - never drops or wipes) (or start fresh)
        run: |
          MYSQL="mysql -h 127.0.0.1 -P 3306 -u root"
          export MYSQL_PWD=root

          restore_fail() {
            echo "RESTORE FAILED at $1: $2"
            bash "$HELPER_DIR/notify.sh" "DB RESTORE FAILED at: $1" "rotating_light,database" "urgent" \
              "$(printf '%s\n' "Failed at: $1" "Snapshot: ${FILE:-none}" "Detail: $2" "" "Nothing was dropped or wiped. Server NOT started, no snapshot will be uploaded.")"
            exit 1
          }

          if [ "$RESTORE_TARGET" = "list" ] || [ "$RESTORE_TARGET" = "ls" ]; then
            echo "=== AVAILABLE SNAPSHOTS ==="
            rclone lsl "$DRIVE_DIR" --include "db_snapshot_*" || true
            echo "=== list done; continuing with LATEST ==="
            RESTORE_TARGET="latest"
          fi

          if [ "$RESTORE_TARGET" = "latest" ] || [ "$RESTORE_TARGET" = "r" ] || [ -z "$RESTORE_TARGET" ]; then
            FILE=$(rclone lsjson "$DRIVE_DIR" --files-only --include "db_snapshot_*" \
                   | jq -r 'sort_by(.ModTime) | .[-1].Name // empty')
          else
            FILE="$RESTORE_TARGET"
          fi

          if rclone lsf "$DRIVE_DIR" --include "license.key.enc" | grep -q "license.key.enc"; then
            rclone copyto "$DRIVE_DIR/license.key.enc" "$HELPER_DIR/license.key.enc" \
              && python "$HELPER_DIR/crypt.py" dec "$HELPER_DIR/license.key.enc" ./license.key \
              && echo "License restored from Drive."
          elif [ -n "${LICENSE_KEY:-}" ]; then
            printf '%s' "$LICENSE_KEY" > ./license.key
            echo "License written from secret LICENSE_KEY."
          else
            echo "No license on Drive and no LICENSE_KEY secret (trial/read-only rules apply)."
          fi
          [ -f license.key ] && sha256sum license.key | cut -d' ' -f1 > "$HELPER_DIR/license_hash"

          $MYSQL -e "CREATE DATABASE IF NOT EXISTS local_django_db CHARACTER SET utf8mb4;"

          if [ -z "$FILE" ]; then
            echo "No snapshot on Drive -> FIRST RUN, starting with a fresh empty database."
            echo "0" > "$HELPER_DIR/restored_size"
            echo "none (first run)" > "$HELPER_DIR/restored_name"
            : > "$HELPER_DIR/rows_restored.tsv"
            echo "DB_READY=true" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Restoring snapshot: $FILE"
          rclone copyto "$DRIVE_DIR/$FILE" "./$FILE"        || restore_fail "download from Drive" "rclone copyto failed"
          python "$HELPER_DIR/crypt.py" dec "./$FILE" "./restored.sql.gz" || restore_fail "decrypt" "wrong BACKUP_SECRET_KEY or corrupt file"
          stat -c %s ./restored.sql.gz > "$HELPER_DIR/restored_size"
          echo "$FILE" > "$HELPER_DIR/restored_name"
          gunzip -c ./restored.sql.gz > ./restored.sql      || restore_fail "gunzip" "snapshot is not a valid gzip"

          EXPECTED=$(grep -c '^CREATE TABLE ' ./restored.sql || true)
          BEFORE=$($MYSQL -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='local_django_db';")
          echo "Tables already in DB before import: $BEFORE (kept untouched)"
          sed -E \
            -e '/^(\/\*![0-9]+ )?DROP /d' \
            -e 's/^CREATE TABLE `/CREATE TABLE IF NOT EXISTS `/' \
            -e 's/^INSERT INTO `/INSERT IGNORE INTO `/' \
            ./restored.sql > ./restored_additive.sql
          $MYSQL local_django_db < ./restored_additive.sql || restore_fail "SQL import" "mysql returned an error while importing"
          rm -f ./restored.sql ./restored_additive.sql ./restored.sql.gz "./$FILE"

          TABLES=$($MYSQL -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='local_django_db';")
          if [ "$TABLES" -lt "$EXPECTED" ]; then
            restore_fail "verify" "snapshot has $EXPECTED tables but only $TABLES exist after import"
          fi
          $MYSQL -N -e "SET SESSION information_schema_stats_expiry=0; SELECT table_name, table_rows FROM information_schema.tables WHERE table_schema='local_django_db' AND table_type='BASE TABLE' ORDER BY table_name;" > "$HELPER_DIR/rows_restored.tsv"
          echo "Restore OK: $TABLES tables loaded (snapshot has $EXPECTED)."
          echo "DB_READY=true" >> "$GITHUB_ENV"

      - name: Apply Migrations & Ensure Superuser
        run: |
          python manage.py makemigrations --noinput || true

          cat > "$HELPER_DIR/migration_guard.py" <<'PYEOF'
          import os, sys
          sys.path.insert(0, os.getcwd())
          import django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "P1.settings")
          django.setup()
          from django.db import connection
          from django.db.migrations.loader import MigrationLoader

          loader = MigrationLoader(connection)
          applied = loader.applied_migrations
          if not applied:
              print("Fresh database: nothing to protect, guard skipped.")
              sys.exit(0)

          def bad(op):
              n = type(op).__name__
              if n in ("DeleteModel", "RemoveField"):
                  return f"{n}({getattr(op, 'name', '')}{'.' + op.model_name if hasattr(op, 'model_name') else ''})"
              if n == "RunSQL":
                  sql = str(getattr(op, "sql", "")).upper()
                  if any(k in sql for k in ("DROP ", "TRUNCATE", "DELETE FROM")):
                      return "RunSQL(DROP/TRUNCATE/DELETE)"
              if n == "SeparateDatabaseAndState":
                  for sub in getattr(op, "database_operations", []):
                      r = bad(sub)
                      if r:
                          return r
              return None

          found = []
          for key in loader.graph.nodes:
              if key in applied:
                  continue
              for op in loader.graph.nodes[key].operations:
                  r = bad(op)
                  if r:
                      found.append(f"{key[0]}.{key[1]}: {r}")
          if found:
              print("DESTRUCTIVE pending migrations:\n  " + "\n  ".join(found))
              open(os.path.join(os.environ["HELPER_DIR"], "destructive.txt"), "w").write("\n".join(found))
              sys.exit(2)
          print("Migration guard OK: pending migrations only add things.")
          PYEOF
          PYTHONPATH="$GITHUB_WORKSPACE" python "$HELPER_DIR/migration_guard.py"
          GUARD_RC=$?
          if [ "$GUARD_RC" -eq 2 ]; then
            bash "$HELPER_DIR/notify.sh" "Migration BLOCKED - would drop data" "no_entry,database" "urgent" \
              "$(printf '%s\n' "Failed at: migration guard (before migrate)" "Pending migrations that drop tables/columns:" "$(cat "$HELPER_DIR/destructive.txt" 2>/dev/null)" "" "Nothing was dropped. Server NOT started.")"
            exit 1
          elif [ "$GUARD_RC" -ne 0 ]; then
            bash "$HELPER_DIR/notify.sh" "Migration guard CRASHED (exit $GUARD_RC)" "warning,database" "high" \
              "$(printf '%s\n' "Failed at: migration_guard.py (could not check pending migrations)" "Continuing with migrate WITHOUT the drop-check. Check the run log.")"
          fi

          if python manage.py migrate --noinput; then
            echo "Migrations applied."
          else
            echo "Migration conflict. Forcing state sync with --fake..."
            bash "$HELPER_DIR/notify.sh" "Migration failed - used --fake" "warning,database" "high" \
              "Failed at: python manage.py migrate. Fell back to migrate --fake (no tables dropped). Some new tables may be missing - check the run log."
            python manage.py migrate --fake --noinput
          fi

          python manage.py shell -c "
          import os
          from django.contrib.auth import get_user_model
          User = get_user_model()
          username = os.environ.get('SUPERUSER_NAME')
          email = os.environ.get('SUPERUSER_EMAIL')
          password = os.environ.get('SUPERUSER_PASSWORD')
          if username and password:
              user, created = User.objects.get_or_create(username=username, defaults={'email': email})
              user.set_password(password)
              user.is_staff = True
              user.is_superuser = True
              user.save()
              print(f'Superuser {username} verified.')
          else:
              print('Skipping superuser (credentials not set).')
          "

      - name: Arrange existing categories into master categories (safe, additive, idempotent)
        run: |
          python manage.py classify_categories --retry-fallback || echo "classify_categories skipped (non-fatal)"

      - name: Stop Here for migrate_now
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'migrate_now' }}
        run: |
          bash "$HELPER_DIR/snapshot.sh" final || true
          curl -d "Forced migration done on local DB and snapshot saved." ntfy.sh/hshshehgag
          echo "STOP_AFTER_MIGRATE=true" >> "$GITHUB_ENV"

      - name: Process & Place PWA Icons from Project Root
        if: env.STOP_AFTER_MIGRATE != 'true'
        run: |
          python -c "
          import os
          from PIL import Image

          project_dir = os.getcwd()
          target_dir = os.path.join(project_dir, 'ceo_module', 'static', 'ceo', 'images')
          os.makedirs(target_dir, exist_ok=True)
          extensions = ('.png', '.jpg', '.jpeg', '.webp')
          found_images = [os.path.join(project_dir, f) for f in os.listdir(project_dir) if f.lower().endswith(extensions)]
          if not found_images:
              print('No source image found in project root.')
          else:
              src = found_images[0]
              print(f'Processing source image: {src}')
              with Image.open(src) as img:
                  img = img.convert('RGBA')
                  for w, h, fn in [(192, 192, 'icon-192.png'), (512, 512, 'icon-512.png')]:
                      img.resize((w, h), Image.Resampling.LANCZOS).save(os.path.join(target_dir, fn), 'PNG')
                      print(f'Saved: {fn}')
          "

      - name: Collect Static Files
        if: env.STOP_AFTER_MIGRATE != 'true'
        run: |
          mkdir -p static
          python manage.py collectstatic --noinput --clear

      - name: Install Cloudflare Tunnel (cloudflared)
        if: env.STOP_AFTER_MIGRATE != 'true'
        run: |
          curl -fsSL --retry 3 --retry-delay 3 --output cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Check and Kill Existing Local Processes
        if: env.STOP_AFTER_MIGRATE != 'true'
        run: |
          pkill -f "gunicorn" || true
          pkill -f "manage.py runserver" || true
          pkill -f "cloudflared" || true
          sleep 2

      - name: Start Gunicorn, Health Check & Auto-Restarting Cloudflare Tunnel
        if: env.STOP_AFTER_MIGRATE != 'true'
        run: |
          touch gunicorn.log tunnel.log

          setsid nohup gunicorn P1.wsgi:application \
            --bind 127.0.0.1:8000 \
            --workers 2 \
            --threads 4 \
            --timeout 120 \
            --access-logfile - \
            --error-logfile - \
            > gunicorn.log 2>&1 < /dev/null &

          echo "Waiting for local Gunicorn health check on 127.0.0.1:8000..."
          READY=0
          for attempt in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/ || echo "000")
            if [ "$CODE" != "000" ]; then
              echo "Local server responded with HTTP $CODE on attempt $attempt."
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Local Gunicorn did not become ready in time. Recent gunicorn.log:"
            tail -n 40 gunicorn.log || true
            exit 1
          fi

          setsid nohup bash -c '
            while true; do
              echo "[$(date -u +"%Y-%m-%d %H:%M:%S UTC")] Starting cloudflared tunnel..." >> tunnel.log
              cloudflared tunnel run --token "$CLOUDFLARE_TOKEN" >> tunnel.log 2>&1
              EXIT_CODE=$?
              echo "[$(date -u +"%Y-%m-%d %H:%M:%S UTC")] cloudflared exited with code $EXIT_CODE. Restarting in 3s..." >> tunnel.log
              sleep 3
            done
          ' > /dev/null 2>&1 < /dev/null &

          sleep 4
          echo "=== GUNICORN & AUTO-RESTARTING CLOUDFLARE TUNNEL LIVE ==="

      - name: Get Public IP & Send Notification to ntfy
        if: env.STOP_AFTER_MIGRATE != 'true'
        run: |
          PUBLIC_IP=$(curl -s --max-time 10 ifconfig.me || curl -s --max-time 10 api.ipify.org || echo "unknown")
          MESSAGE="Django App Live! (Gunicorn + Local MySQL on runner, snapshots on Drive)
          Domain: https://shops.hadi88.online
          Runner IP: $PUBLIC_IP"
          curl -s --max-time 15 -d "$MESSAGE" ntfy.sh/hshshehgag || true

      - name: Realtime HTTP Access Logs & Error Stream
        if: env.STOP_AFTER_MIGRATE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          for i in {1..65}; do
            for s in {1..12}; do
              sleep 5
            done
            LATEST_RUN_ID=$(gh api "repos/$REPO/actions/runs?branch=$BRANCH&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || echo "$CURRENT_RUN_ID")
            if [ -n "$LATEST_RUN_ID" ] && [ "$LATEST_RUN_ID" -gt "$CURRENT_RUN_ID" ]; then
              echo "Newer run ($LATEST_RUN_ID) detected. Ending log stream -> final snapshot."
              exit 0
            fi

            echo "------------------------------------------"
            echo "TIMESTAMP: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "--- GUNICORN LOGS (TAIL) ---"
            tail -n 30 gunicorn.log || echo "No Gunicorn logs yet."
            echo "--- CLOUDFLARED TUNNEL LOGS (TAIL) ---"
            tail -n 15 tunnel.log || echo "No Tunnel logs yet."
            echo "--- RECENT EXCEPTIONS / ERRORS ---"
            grep -i -C 2 "error\|exception\|traceback" gunicorn.log | tail -n 30 || echo "No errors detected."
          done || true

      - name: Final Snapshot to Google Drive (stop server first)
        if: ${{ always() && env.DB_READY == 'true' && env.STOP_AFTER_MIGRATE != 'true' }}
        run: |
          pkill -f "cloudflared" || true
          pkill -f "gunicorn" || true
          pkill -f "manage.py runserver" || true
          pkill -f "snapshot.sh" || true
          sleep 3
          bash "$HELPER_DIR/snapshot.sh" final
