name: kconn_rider
description: 88 Riders - Khanewal Connect rider app
publish_to: 'none'
version: 1.7.0+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Push notification (app band ho tab bhi naya order alert)
  firebase_core: '>=3.8.0'
  firebase_messaging: '>=15.1.0'
  flutter_local_notifications: ^18.0.1   # sirf high-importance channel banane ke liye

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

# App icon (GitHub Action mein `dart run flutter_launcher_icons` se android mipmaps ban'te hain)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FDFDFD"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
