<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5a00">
<meta name="robots" content="index, follow">
<title>{{ page_title }} - {{ company_name }}</title>
<style>
  :root{--brand:#ff5a00;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--bg:#f6f7f9;--card:#fff;--danger:#dc2626}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e5e7eb;--mut:#9ca3af;--line:#2f3542;--bg:#12151b;--card:#1b1f27}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px}
  .top{background:linear-gradient(135deg,#ff5a00,#ff8a3d);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 18px}
  .top-in,.wrap{max-width:820px;margin:0 auto}
  .top h1{margin:0;font-size:1.35rem;line-height:1.25}
  .top p{margin:4px 0 0;opacity:.9;font-size:.9rem}
  .wrap{padding:16px 14px calc(40px + env(safe-area-inset-bottom,0px))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:14px}
  h2{font-size:1.1rem;margin:0 0 8px;color:var(--brand)}
  p{margin:0 0 10px}
  ul{margin:0 0 10px;padding-left:20px}
  li{margin-bottom:4px}
  a{color:var(--brand);word-break:break-word}
  .note{font-size:.88rem;color:var(--mut)}
  .steps{counter-reset:s;list-style:none;padding:0}
  .steps li{counter-increment:s;position:relative;padding:0 0 10px 38px}
  .steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center}
  .btn{display:inline-block;padding:11px 18px;border-radius:10px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700}
  .links{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.9rem;margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .tbl{overflow-x:auto}
  @media (min-width:640px){.top h1{font-size:1.6rem}.card{padding:22px 24px}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1>{{ page_title }}</h1>
  <p>{{ company_name }}</p>
</div></header>
<main class="wrap">
{% block body %}{% endblock %}
  <p class="links">
    <a href="{% url 'privacy_policy' %}">Privacy Policy</a>
    <a href="{% url 'delete_account_info' %}">Delete Account</a>
    <a href="{% url 'shop_home' %}">Back to Shop</a>
  </p>
</main>
</body>
</html>
